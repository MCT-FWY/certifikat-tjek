<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certifikat-tjek · FWY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23C2551E'/%3E%3Ctext x='16' y='20.5' font-family='Arial' font-weight='800' font-size='12' fill='white' text-anchor='middle'%3Efwy%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="fwy.css">
<style>
  /* Kun det, der er særligt for certifikat-tjek – resten kommer fra fwy.css */

  .topbar .btn.running { opacity: 1; border-color: var(--warning); color: var(--warning); }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }   /* fem nøgletal på én linje */
  .tile.warn .value { color: var(--warning-ink); }

  /* ── Advarsler ── */
  .warn-list { display: grid; gap: 8px; }
  .warn-item { display: flex; align-items: flex-start; gap: 10px; margin: 0; }
  .warn-item .body { flex: 1; min-width: 0; line-height: 1.5; }
  .warn-item .tag { margin-right: 6px; }
  .warn-item .btn { flex: none; align-self: center; }
  .warn-item.flash { animation: warn-flash 1.6s ease-out; }
  @keyframes warn-flash { 0%, 40% { background: var(--warning-wash); } 100% { background: var(--surface-2); } }

  /* ── Sektioner med certifikatkort ── */
  .section { margin-bottom: 28px; }
  .section .section-title { display: flex; align-items: center; gap: 8px; }
  .certs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }

  .cert {
    position: relative; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--axis);
    border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-1);
    transition: box-shadow .15s, transform .15s;
  }
  .cert:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .cert:hover::after {
    content: "Åbn certifikat \2197"; position: absolute; bottom: 10px; right: 12px;
    font-size: .7rem; font-weight: 600; color: var(--muted); pointer-events: none;
  }
  .cert.gyldig         { border-left-color: var(--ok); }
  .cert.udloeber_snart { border-left-color: var(--warning); }
  .cert.udloebet       { border-color: var(--critical); background: var(--critical-wash); }
  .cert.udloebet .tag-critical { background: var(--surface); }

  /* Kort med advarsel: mærke nederst til højre, "Åbn certifikat" flyttes til venstre */
  .cert.has-warning { padding-bottom: 38px; }
  .cert.has-warning:hover::after { right: auto; left: 16px; }
  .cert-warning { position: absolute; bottom: 10px; right: 12px; cursor: pointer; }

  /* Slet og ret – vises, når musen er over kortet */
  .cert-actions {
    position: absolute; top: 8px; right: 6px; display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transition: opacity .15s;
  }
  .cert:hover .cert-actions, .cert:focus-within .cert-actions { opacity: 1; }
  .icon-btn {
    width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent;
    color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: .95rem; line-height: 1;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { background: var(--critical-wash); color: var(--critical); }

  .cert-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; padding-right: 26px; }
  .cert-name { font-weight: 600; line-height: 1.3; }
  .cert-meta { display: flex; flex-direction: column; gap: 5px; font-size: .82rem; color: var(--ink-2); }
  .cert-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cert-type { font-weight: 650; color: var(--ink); }
  .cert-holder { line-height: 1.4; }
  .cert-label { font-size: .68rem; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 4px; }
  .cert-note { font-size: .76rem; font-style: italic; color: var(--muted); }
  .cert-note.stale { color: var(--warning-ink); }
  .cert-error {
    margin-top: 9px; font-size: .78rem; line-height: 1.4; color: var(--critical);
    background: var(--critical-wash); padding: 6px 9px; border-radius: var(--radius-sm);
  }

  /* ── Formular i dialogen ── */
  .modal .field { margin-bottom: 14px; }
  .field label .muted { font-weight: 400; }
  .form-row { display: flex; gap: 12px; }
  .form-row .field { flex: 1; min-width: 0; }
  .form-row .field.grow { flex: 2; }
  #modal-status { margin: 4px 0 0; }

  /* ── Tjek log ── */
  .modal.wide { max-width: 680px; }
  .log-output {
    margin: 10px 0 0; max-height: 50vh; overflow: auto; white-space: pre-wrap;
    background: var(--topbar); color: #e6e6e3; border-radius: 8px; padding: 12px 14px;
    font: .76rem/1.55 var(--font-mono);
  }

  @media (max-width: 700px) {
    .brand .sub { display: none; }
    .form-row { flex-direction: column; gap: 0; }
    .cert-actions { opacity: 1; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a class="fwy-mark" href="/" data-fwy-forside title="Alle FWY-værktøjer">fwy</a>
    <a class="crumb" href="/" data-fwy-forside>FWY værktøjer</a>
    <span class="crumb-sep">/</span>
    <h1>Certifikat-tjek</h1>
    <span class="sub">MSC · ASC · Øko</span>
  </div>
  <div class="topmeta">
    <span id="last-checked">Indlæser&hellip;</span>
    <button type="button" class="btn" id="log-btn">Tjek log</button>
    <button type="button" class="btn" id="run-btn">&#9654; Tjek alle nu</button>
    <button type="button" class="btn btn-primary" id="add-btn">+ Tilføj leverandør</button>
  </div>
</header>

<main>
  <section class="tiles" id="summary" hidden>
    <div class="tile ok"><div class="label">Gyldige</div><div class="value" id="s-gyldig">0</div></div>
    <div class="tile" id="t-snart"><div class="label">Udløber snart</div><div class="value" id="s-snart">0</div><div class="sub">inden for 30 dage</div></div>
    <div class="tile" id="t-udloebet"><div class="label">Udløbet</div><div class="value" id="s-udloebet">0</div></div>
    <div class="tile"><div class="label">Ukendt</div><div class="value" id="s-ukendt">0</div><div class="sub">kunne ikke tjekkes</div></div>
    <button type="button" class="tile alert" id="t-advarsler" hidden><div class="label">Advarsler</div><div class="value" id="s-advarsler">0</div><div class="sub">se nedenfor</div></button>
  </section>

  <section class="card" id="warnings-section" hidden></section>

  <div id="certs"><div class="loading">Indlæser&hellip;</div></div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ── Tilføj / ret leverandør ── -->
<div id="add-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Tilføj leverandør</h2>

    <div class="field">
      <label for="f-name">Leverandørnavn</label>
      <input type="text" id="f-name" placeholder="f.eks. Ny Leverandør A/S" autocomplete="off">
      <div id="f-name-hint" class="help" hidden></div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="f-type">Certifikattype</label>
        <select id="f-type">
          <option value="msc">MSC</option>
          <option value="asc">ASC</option>
          <option value="eco">ØKO</option>
        </select>
      </div>
      <div class="field grow">
        <label for="f-certid">Certifikatnummer</label>
        <input type="text" id="f-certid" placeholder="MSC-C-XXXXX" autocomplete="off">
      </div>
    </div>

    <div id="eco-fields" class="form-row" hidden>
      <div class="field">
        <label for="f-country">Land <span class="muted">ISO-kode</span></label>
        <input type="text" id="f-country" placeholder="DK" maxlength="4" autocomplete="off">
      </div>
      <div class="field grow">
        <label for="f-search">Søgeterm i TRACES <span class="muted">auto-udfyldes</span></label>
        <input type="text" id="f-search" placeholder="Firmanavn som det fremgår i TRACES" autocomplete="off">
      </div>
    </div>

    <div id="modal-status" class="note" hidden></div>

    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel">Annuller</button>
      <button type="button" class="btn btn-primary" id="modal-save">Gem leverandør</button>
    </div>
  </div>
</div>

<!-- ── Tjek log ── -->
<div id="log-modal" class="modal-backdrop" hidden>
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="log-title">
    <h2 id="log-title">Tjek log</h2>
    <div id="log-content">Indlæser&hellip;</div>
    <div class="modal-actions">
      <button type="button" class="btn" id="log-close">Luk</button>
    </div>
  </div>
</div>

<script>
// Forsiden kører på port 80 på samme pc som værktøjet
document.querySelectorAll("[data-fwy-forside]").forEach(a => a.href = `${location.protocol}//${location.hostname}/`);

/* ═══════════════════════════════════════════
   SERVER-API (server.py på mini-pc'en)
═══════════════════════════════════════════ */
// GET uden body, POST med body. Serveren svarer {fejl: "..."} når noget går galt.
async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.fejl || `Serveren svarede ${r.status}`);
  return data;
}

/* ═══════════════════════════════════════════
   DASHBOARD RENDERING
═══════════════════════════════════════════ */
const TYPE_LABEL = { eco: "Øko", msc: "MSC", asc: "ASC" };
const STATUS_LABEL = {
  gyldig: "Gyldig", udloeber_snart: "Udløber snart",
  udloebet: "Udløbet", ukendt: "Ukendt",
};
const STATUS_TAG = { gyldig: "tag-ok", udloeber_snart: "tag-warning", udloebet: "tag-critical", ukendt: "" };
let allResults = [];
let allWarnings = [];   // advarsler fra sidste tjek, minus dem der er godkendt

const escHtml = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const escAttr = s => escHtml(s).replace(/"/g, "&quot;");

// Samme nøgle som _warning_key() i check_certificates.py – navnenes rækkefølge er ligegyldig
function warningKey(w) {
  return [w.warning_type, w.certificate_id, [...(w.names || [])].sort().join("|")].join("::");
}

// Advarsler der vedrører et bestemt kort
function warningsFor(r) {
  return allWarnings.filter(w => {
    if (w.warning_type === "data")   // samme betingelse som data_warnings() i check_certificates.py
      return w.cert_type === r.type && !r.error && r.status !== "udløbet"
          && (!r.valid_until || r.stale_since);
    return w.certificate_id === r.certificate_id
        && (!w.cert_type || w.cert_type === r.type)
        && (w.names || []).includes(r.name);
  });
}

function certUrl(r) {
  if (r.type === "msc")
    return `https://cert.msc.org/supplierdirectory/Default.aspx?certno=${encodeURIComponent(r.certificate_id)}`;
  if (r.type === "asc")
    return `https://asc-aqua.org/find-a-supplier/${encodeURIComponent(r.certificate_id)}/`;
  // eco – TRACES NT søgning på certifikatreference (eller certifikat-ID som fallback)
  const ref = r.traces_reference || r.certificate_id;
  return `https://webgate.ec.europa.eu/tracesnt/directory/publication/organic-operator/index#!?query=${encodeURIComponent(ref)}&sort=-issuedOn&states=ISSUED`;
}

function safeClass(s) {
  return (s || "ukendt")
    .replace(/ø/g, "oe").replace(/Ø/g, "OE")
    .replace(/æ/g, "ae").replace(/Æ/g, "AE")
    .replace(/å/g, "aa").replace(/Å/g, "AA")
    .replace(/\s/g, "_");
}

function formatDate(iso) {
  if (!iso) return null;
  try { return new Date(iso).toLocaleDateString("da-DK", { day:"2-digit", month:"short", year:"numeric" }); }
  catch { return iso; }
}

function daysChip(r) {
  const d = r.days_until_expiry;
  if (d === null || d === undefined) return "";
  if (d < 0)   return `<span class="tag tag-critical">Udløbet for ${Math.abs(d)} dage siden</span>`;
  if (d === 0) return `<span class="tag tag-critical">Udløber i dag!</span>`;
  if (d <= 30) return `<span class="tag tag-warning">Udløber om ${d} dage</span>`;
  return `<span class="tag tag-ok">Udløber om ${d} dage</span>`;
}

function buildCard(r) {
  const sc       = safeClass(r.status);
  const dateStr  = formatDate(r.valid_until);
  const dbName   = r.traces_operator || r.asc_cert_holder || r.msc_cert_holder;
  const chipHtml = daysChip(r);

  // Vises også når den er lig leverandørnavnet – ellers ligner det manglende data
  const operatorRow = dbName
    ? `<div class="cert-holder"><span class="cert-label">Certifikatholder</span>${escHtml(dbName)}</div>` : "";
  const refRow = r.traces_reference
    ? `<div class="cert-row"><code>${escHtml(r.traces_reference)}</code></div>` : "";
  const notCheckedRow = r._new
    ? `<div class="cert-note">Ikke tjekket endnu – tjekkes ved næste kørsel</div>` : "";
  const staleRow = r.stale_since
    ? `<div class="cert-note stale">Udløbsdato fra tidligere tjek (${formatDate(r.stale_since)})</div>` : "";

  const cardWarnings = warningsFor(r);
  const warningBadge = cardWarnings.length
    ? `<span class="tag tag-warning cert-warning" data-key="${escAttr(warningKey(cardWarnings[0]))}"
             title="${escAttr(cardWarnings.map(w => w.message).join("\n") + "\n\nKlik for at se advarslen")}">&#9888; Advarsel</span>`
    : "";

  return `
    <div class="cert ${sc}${cardWarnings.length ? " has-warning" : ""}"
         ${r.type === "msc" ? `title="Åbner MSC's søgeside – certifikatnummeret kopieres, så du kan indsætte det (Ctrl+V)"` : ""}
         data-url="${escAttr(certUrl(r))}"
         data-name="${escAttr(r.name)}"
         data-type="${escAttr(r.type)}"
         data-cert="${escAttr(r.certificate_id)}">
      <div class="cert-actions">
        <button type="button" class="icon-btn danger cert-delete" title="Fjern leverandør" aria-label="Fjern leverandør">&#215;</button>
        <button type="button" class="icon-btn cert-edit" title="Ret leverandør" aria-label="Ret leverandør">&#9998;</button>
      </div>
      <div class="cert-top">
        <div class="cert-name">${escHtml(r.name)}</div>
        <span class="tag ${STATUS_TAG[sc] ?? ""}">${STATUS_LABEL[sc] || escHtml(r.status)}</span>
      </div>
      <div class="cert-meta">
        <div class="cert-row">
          <span class="cert-type">${TYPE_LABEL[r.type] || escHtml(r.type.toUpperCase())}</span>
          <code>${escHtml(r.certificate_id)}</code>
        </div>
        ${operatorRow}${refRow}
        ${dateStr ? `<div class="cert-row">Udløber: <strong>${dateStr}</strong></div>` : ""}
        ${chipHtml ? `<div class="cert-row">${chipHtml}</div>` : ""}
        ${staleRow}${notCheckedRow}
      </div>
      ${r.error ? `<div class="cert-error">&#9888; ${escHtml(r.error)}</div>` : ""}${warningBadge}
    </div>`;
}

function buildSection(title, results) {
  if (!results.length) return "";
  return `
    <section class="section">
      <h2 class="section-title">${title} <span class="tag">${results.length}</span></h2>
      <div class="certs">${results.map(buildCard).join("")}</div>
    </section>`;
}

function renderWarnings() {
  const warnings = allWarnings;
  document.getElementById("s-advarsler").textContent = warnings.length;
  document.getElementById("t-advarsler").hidden = !warnings.length;

  const el = document.getElementById("warnings-section");
  el.hidden = !warnings.length;
  if (!warnings.length) { el.innerHTML = ""; return; }

  const TYPE_LABEL_W = { duplicate: "Duplikat", format: "Format", data: "Datakilde" };
  const items = warnings.map(w => {
    const label = TYPE_LABEL_W[w.warning_type] || w.warning_type;
    const cert  = w.certificate_id ? `<code>${escHtml(w.certificate_id)}</code> &mdash; ` : "";
    // Datakilde-advarsler forsvinder af sig selv, når kilden virker igen – de kan ikke godkendes
    const approve = w.warning_type !== "data"
      ? `<button type="button" class="btn warning-approve" title="Marker advarslen som i orden – den vises ikke længere">Godkend</button>` : "";
    return `<div class="note warn-item${w.warning_type === "data" ? " note-critical" : ""}" data-key="${escAttr(warningKey(w))}">
      <div class="body"><span class="tag tag-warning">${label}</span>${cert}${escHtml(w.message)}</div>
      ${approve}
    </div>`;
  }).join("");

  el.innerHTML = `
    <div class="card-head"><div>
      <h2>&#9888; Advarsler (${warnings.length})</h2>
      <p>Godkend en advarsel, hvis den er i orden – fx et certifikat, der bevidst er delt mellem to leverandører.</p>
    </div></div>
    <div class="warn-list">${items}</div>`;

  el.querySelectorAll(".warning-approve").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.closest(".warn-item").dataset.key;
      approveWarning(allWarnings.find(w => warningKey(w) === key), btn);
    });
  });
}

async function approveWarning(w, btn) {
  if (!w) return;
  const who = (w.names || []).join(" og ");
  if (!window.confirm(
      `Godkend advarslen for ${w.certificate_id}?\n\n${who}\n\n` +
      `Advarslen vises ikke længere for disse leverandører. ` +
      `Kommer der en ny leverandør med samme certifikatnummer, vises den igen.`))
    return;

  btn.disabled = true;
  try {
    const res = await api("/api/advarsel/godkend", {
      warning_type: w.warning_type, certificate_id: w.certificate_id, names: w.names,
    });
    showToast(res.besked);
    await load();
  } catch (err) {
    btn.disabled = false;
    showToast("Fejl: " + err.message, true);
  }
}

function renderDashboard() {
  const priority = { udloebet: 0, udloeber_snart: 1, gyldig: 2, ukendt: 3 };
  const sorted = [...allResults].sort((a, b) =>
    (priority[safeClass(a.status)] ?? 9) - (priority[safeClass(b.status)] ?? 9)
  );
  const groups = { eco: [], msc: [], asc: [] };
  for (const r of sorted) (groups[r.type] ??= []).push(r);

  document.getElementById("certs").innerHTML =
    buildSection("Øko-certifikater", groups.eco)
    + buildSection("MSC-certifikater", groups.msc)
    + buildSection("ASC-certifikater", groups.asc)
    || `<div class="loading">Ingen leverandører endnu – tilføj den første med «Tilføj leverandør».</div>`;

  attachCardClicks();
}

let toastTimer;
function showToast(msg, isError) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.hidden = true, isError ? 7000 : 4000);
}

function flashWarning(key) {
  const target = [...document.querySelectorAll("#warnings-section .warn-item")].find(el => el.dataset.key === key)
              || document.getElementById("warnings-section");
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
}

// MSC kan ikke deep-linkes (cert.msc.org kræver en session), så vi kopierer
// certifikatnummeret til udklipsholderen, inden søgesiden åbnes.
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext)
    return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
}

function attachCardClicks() {
  document.querySelectorAll(".cert[data-url]").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".cert-actions")) return;
      const badge = e.target.closest(".cert-warning");
      if (badge) { flashWarning(badge.dataset.key); return; }
      if (card.dataset.type === "msc") {
        const certId = card.dataset.cert;
        copyText(certId).then(
          () => showToast(`${certId} kopieret – indsæt i MSC's søgefelt (Ctrl+V)`),
          () => showToast(`Søg efter ${certId} på MSC's side`)
        );
      }
      window.open(card.dataset.url, "_blank", "noopener,noreferrer");
    });
  });
  document.querySelectorAll(".cert-delete").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".cert");
      confirmDelete(card.dataset.name, card.dataset.type, card.dataset.cert);
    });
  });
  document.querySelectorAll(".cert-edit").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".cert");
      openEditModal(card.dataset.name, card.dataset.type, card.dataset.cert);
    });
  });
}

// Serveren tilpasser resultaterne til den nuværende leverandørliste og fjerner
// godkendte advarsler, så ændringer ses med det samme – også før næste tjek
async function load() {
  try {
    const data = await api("/api/resultater");

    document.getElementById("last-checked").textContent = data.checked_at
      ? "Sidst tjekket " + new Date(data.checked_at).toLocaleString("da-DK", { dateStyle: "short", timeStyle: "short" })
      : "Ikke tjekket endnu";

    const s = data.summary || {};
    document.getElementById("summary").hidden = false;
    document.getElementById("s-gyldig").textContent   = s.gyldig         || 0;
    document.getElementById("s-snart").textContent    = s.udloeber_snart || 0;
    document.getElementById("s-udloebet").textContent = s.udloebet       || 0;
    document.getElementById("s-ukendt").textContent   = s.ukendt         || 0;
    document.getElementById("t-snart").classList.toggle("warn", !!s.udloeber_snart);
    document.getElementById("t-udloebet").classList.toggle("alert", !!s.udloebet);

    allWarnings = data.warnings || [];
    renderWarnings();

    allResults = data.results || [];
    renderDashboard();
  } catch (err) {
    document.getElementById("certs").innerHTML =
      `<div class="note note-critical"><strong>Kunne ikke hente data:</strong> ${escHtml(err.message)}<br>
       <span class="muted">Kører server.py på mini-pc'en?</span></div>`;
    console.error("load() fejl:", err);
  }
}

setInterval(load, 60 * 60 * 1000);
document.getElementById("t-advarsler").addEventListener("click", () => flashWarning(null));

/* ═══════════════════════════════════════════
   TILFØJ / RET LEVERANDØR
═══════════════════════════════════════════ */
let editTarget = null;   // { name, type, certId } når formularen bruges til at rette

function openAddModal() {
  editTarget = null;
  document.getElementById("modal-title").textContent = "Tilføj leverandør";
  document.getElementById("f-name-hint").hidden = true;
  document.getElementById("f-type").disabled = false;
  document.getElementById("f-name").value    = "";
  document.getElementById("f-type").value    = "msc";
  document.getElementById("f-certid").value  = "";
  document.getElementById("f-country").value = "";
  document.getElementById("f-search").value  = "";
  updateEcoFields();
  setModalStatus(null);
  document.getElementById("modal-save").disabled = false;
  document.getElementById("modal-save").textContent = "Gem leverandør";
  document.getElementById("add-modal").hidden = false;
  setTimeout(() => document.getElementById("f-name").focus(), 50);
}

function closeAddModal() {
  document.getElementById("add-modal").hidden = true;
}

async function openEditModal(name, type, certId) {
  openAddModal();   // nulstil formularen
  editTarget = { name, type, certId };
  document.getElementById("modal-title").textContent = "Ret leverandør";
  document.getElementById("f-name").value   = name;
  document.getElementById("f-type").value   = type;
  document.getElementById("f-type").disabled = true;   // ny type = fjern og tilføj i stedet
  document.getElementById("f-certid").value = certId;
  document.getElementById("modal-save").textContent = "Gem ændringer";
  updateEcoFields();

  // Land/søgeterm (øko) og antal certifikater står kun i leverandørlisten
  const suppliers = await api("/api/leverandoerer").catch(() => null);
  if (!suppliers || editTarget?.certId !== certId) return;
  if (type === "eco") {
    const s = (suppliers.eco || []).find(s => s.certificate_id === certId && s.name === name);
    if (s) {
      document.getElementById("f-country").value = s.country || "";
      document.getElementById("f-search").value  = s.search_query || "";
    }
  } else {
    const s = (suppliers[type] || []).find(s => s.name === name);
    const n = s ? s.certificate_ids.length : 1;
    if (n > 1) {
      const hint = document.getElementById("f-name-hint");
      hint.textContent = `${name} har ${n} ${TYPE_LABEL[type]}-certifikater – ændres navnet, gælder det dem alle.`;
      hint.hidden = false;
    }
  }
}

function updateEcoFields() {
  const type = document.getElementById("f-type").value;
  document.getElementById("eco-fields").hidden = type !== "eco";
  document.getElementById("f-certid").placeholder =
    type === "eco" ? "IE-ORG-03 / DE-ÖKO-039" : type === "msc" ? "MSC-C-XXXXX" : "ASC-C-XXXXX";
}

function setModalStatus(msg, isError) {
  const el = document.getElementById("modal-status");
  el.hidden = !msg;
  el.className = "note " + (isError ? "note-critical" : "note-ok");
  el.textContent = msg || "";
}

document.getElementById("add-btn").addEventListener("click", openAddModal);
document.getElementById("modal-cancel").addEventListener("click", closeAddModal);
document.getElementById("add-modal").addEventListener("click", e => {
  if (e.target === document.getElementById("add-modal")) closeAddModal();
});
document.getElementById("f-type").addEventListener("change", updateEcoFields);

// Serveren tjekker felterne (navn, nummerformat, landekode) og svarer med en fejltekst
document.getElementById("modal-save").addEventListener("click", async () => {
  const fields = {
    type:           document.getElementById("f-type").value,
    name:           document.getElementById("f-name").value,
    certificate_id: document.getElementById("f-certid").value,
    country:        document.getElementById("f-country").value,
    search_query:   document.getElementById("f-search").value,
  };

  const btn = document.getElementById("modal-save");
  btn.disabled = true;
  btn.textContent = "Gemmer…";
  setModalStatus(null);

  try {
    const t = editTarget;
    const res = t
      ? await api("/api/leverandoer/ret", {
          fra: { type: t.type, name: t.name, certificate_id: t.certId }, til: fields })
      : await api("/api/leverandoer", fields);
    await load();
    setModalStatus(res.besked + (t ? "" : " Den tjekkes ved næste kørsel."));
    btn.textContent = "Gemt ✓";
    setTimeout(closeAddModal, 1800);
  } catch (err) {
    setModalStatus(err.message, true);
    btn.disabled = false;
    btn.textContent = editTarget ? "Gem ændringer" : "Gem leverandør";
  }
});

/* ═══════════════════════════════════════════
   SLET LEVERANDØR
═══════════════════════════════════════════ */
async function confirmDelete(name, type, certId) {
  const typeLabel = TYPE_LABEL[type] || type.toUpperCase();
  if (!window.confirm(`Fjern ${name} – ${certId} (${typeLabel}) fra leverandørlisten?\n\nLeverandøren tjekkes ikke længere.`))
    return;

  try {
    const res = await api("/api/leverandoer/slet", { type, name, certificate_id: certId });
    showToast(res.besked);
    await load();
  } catch (err) {
    showToast("Fejl: " + err.message, true);
  }
}

/* ═══════════════════════════════════════════
   TJEK LOG (kørsler på mini-pc'en)
═══════════════════════════════════════════ */
const RUN_TAG = {
  ok:      `<span class="tag tag-ok">&#10003; Gennemført</span>`,
  koerer:  `<span class="tag tag-warning">&#8635; Kører&hellip;</span>`,
  fejl:    `<span class="tag tag-critical">&#10007; Fejlet</span>`,
  afbrudt: `<span class="tag tag-critical">&#10007; Afbrudt</span>`,
};

function duration(r) {
  if (!r.slut) return "";
  const secs = Math.round((new Date(r.slut) - new Date(r.startet)) / 1000);
  return secs < 60 ? `${secs} s` : `${Math.floor(secs / 60)} min ${secs % 60} s`;
}

async function showLog() {
  const content = document.getElementById("log-content");
  content.innerHTML = `<div class="loading">Indlæser&hellip;</div>`;
  try {
    const runs = (await api("/api/log")).koersler;
    if (!runs.length) {
      content.innerHTML = `<p class="muted">Ingen kørsler endnu.</p>`;
      return;
    }
    const rows = runs.map(r => `
      <tr class="click" data-id="${escAttr(r.id)}" title="Klik for at se, hvad tjekket skrev">
        <td class="num">${new Date(r.startet).toLocaleString("da-DK", { dateStyle: "short", timeStyle: "short" })}</td>
        <td>${RUN_TAG[r.status] || escHtml(r.status)}${r.besked ? `<div class="sub">${escHtml(r.besked)}</div>` : ""}</td>
        <td class="muted">${r.udloest_af === "automatisk" ? "Automatisk" : "Manuel"}</td>
        <td class="num muted">${duration(r)}</td>
      </tr>`).join("");
    content.innerHTML = `
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Tidspunkt</th><th>Status</th><th>Udl&oslash;st af</th><th class="num">Varighed</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
    content.querySelectorAll("tbody tr").forEach(tr =>
      tr.addEventListener("click", () => showLogOutput(runs.find(r => r.id === tr.dataset.id))));
  } catch (err) {
    content.innerHTML = `<div class="note note-critical">Kunne ikke hente log: ${escHtml(err.message)}</div>`;
  }
}

async function showLogOutput(run) {
  const content = document.getElementById("log-content");
  content.innerHTML = `<div class="loading">Indlæser&hellip;</div>`;
  try {
    const { tekst } = await api("/api/log/tekst?id=" + encodeURIComponent(run.id));
    content.innerHTML = `
      <button type="button" class="link log-back">&larr; Alle kørsler</button>
      <span class="muted"> · ${new Date(run.startet).toLocaleString("da-DK")}</span>
      <pre class="log-output">${escHtml(tekst || (run.status === "koerer" ? "Tjekket kører stadig…" : "Ingen output gemt."))}</pre>`;
    content.querySelector(".log-back").addEventListener("click", showLog);
  } catch (err) {
    content.innerHTML = `<div class="note note-critical">Kunne ikke hente output: ${escHtml(err.message)}</div>`;
  }
}

function closeLog() { document.getElementById("log-modal").hidden = true; }

document.getElementById("log-btn").addEventListener("click", () => {
  document.getElementById("log-modal").hidden = false;
  showLog();
});
document.getElementById("log-close").addEventListener("click", closeLog);
document.getElementById("log-modal").addEventListener("click", e => {
  if (e.target === document.getElementById("log-modal")) closeLog();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  closeAddModal();
  closeLog();
});

/* ═══════════════════════════════════════════
   MANUEL CERTIFIKAT-TJEK
═══════════════════════════════════════════ */
// Tjekket kører i baggrunden på serveren. Knappen viser, at det kører – også når det
// er det automatiske morgentjek eller en kollega, der har startet det.
const RUN_LABEL = "▶ Tjek alle nu";
let runWasActive = false;
let runTimer;

function showRunning(run) {
  const btn = document.getElementById("run-btn");
  btn.disabled = !!run;
  btn.classList.toggle("running", !!run);
  btn.textContent = run
    ? `Kører… ${Math.floor(run.sekunder / 60)}:${String(run.sekunder % 60).padStart(2, "0")}`
    : RUN_LABEL;
}

async function watchRun() {
  let delay = 60 * 1000;            // kig efter et nyt tjek hvert minut, hvert 2. sekund mens det kører
  try {
    const st = await api("/api/tjek");
    showRunning(st.koerer);
    if (st.koerer) {
      runWasActive = true;
      delay = 2000;
    } else if (runWasActive) {
      runWasActive = false;
      await load();
      const ok = st.sidste?.status === "ok";
      showToast(ok ? "Tjekket er færdigt – dashboardet er opdateret" : "Tjekket fejlede – se Tjek log", !ok);
    }
  } catch (err) {
    console.error("watchRun() fejl:", err);
  }
  clearTimeout(runTimer);
  runTimer = setTimeout(watchRun, delay);
}

document.getElementById("run-btn").addEventListener("click", async () => {
  const btn = document.getElementById("run-btn");
  btn.disabled = true;
  btn.textContent = "Starter…";
  try {
    await api("/api/tjek", {});
  } catch (err) {
    showToast("Fejl: " + err.message, true);   // fx at et tjek allerede kører – så viser watchRun det
  }
  watchRun();
});

load();
watchRun();
</script>
