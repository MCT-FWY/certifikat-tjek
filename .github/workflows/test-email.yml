name: Test e-mail notifikation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Test-scenarie'
        required: false
        default: 'warning'
        type: choice
        options:
          - warning
          - expired

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installér afhængigheder
        run: pip install -r requirements.txt

      - name: Send test-email
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TEST_SCENARIO: ${{ github.event.inputs.scenario }}
        run: python check_certificates.py --test-email --scenario "$TEST_SCENARIO"
