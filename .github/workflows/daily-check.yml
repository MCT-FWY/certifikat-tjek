name: Dagligt certifikat-tjek

on:
  schedule:
    - cron: '0 6 * 4-10 *'      # 08:00 CEST (UTC+2) – april–oktober
    - cron: '0 7 * 1-3,11-12 *' # 08:00 CET  (UTC+1) – november–marts
    - cron: '0 7 * 4-10 *'      # 09:00 CEST – backup hvis 08:00 springes over
    - cron: '0 8 * 1-3,11-12 *' # 09:00 CET  – backup hvis 08:00 springes over
  workflow_dispatch:   # Tillader manuel kørsel fra GitHub Actions-fanen (springer aldrig over)

permissions:
  contents: write      # Nødvendigt for at gemme results/latest.json i repoen

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      # Backup-cron'en kører altid, og GitHub forsinker planlagte kørsler med timer.
      # Uden dette tjek kører det hele to gange om dagen og sender e-mails dobbelt.
      - name: Spring over hvis dagens tjek allerede er kørt
        id: guard
        if: github.event_name == 'schedule'
        shell: python3 {0}
        run: |
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Copenhagen")
          try:
              with open("results/latest.json", encoding="utf-8") as f:
                  last = datetime.fromisoformat(json.load(f)["checked_at"]).astimezone(tz).date()
          except (OSError, ValueError, KeyError):
              last = None
          today = datetime.now(tz).date()
          skip = last == today
          print(f"Sidste tjek: {last}, i dag: {today} -> {'springer over' if skip else 'kører'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")

      - name: Sæt Python op
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installér afhængigheder
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Kør certifikat-tjek
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: false
        timeout-minutes: 10
        env:
          MSC_API_KEY:    ${{ secrets.MSC_API_KEY }}
          ASC_API_KEY:    ${{ secrets.ASC_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          for i in 1 2 3; do
            echo "Forsøg $i/3..."
            python check_certificates.py && break
            if [ $i -lt 3 ]; then
              echo "Fejlede – venter 15 sekunder før næste forsøg..."
              sleep 15
            else
              echo "Alle 3 forsøg fejlede."
              exit 1
            fi
          done

      - name: Gem resultater i repo
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp results/latest.json /tmp/latest.json
          git pull origin main
          cp /tmp/latest.json results/latest.json
          git add results/latest.json
          git diff --staged --quiet || git commit -m "chore: certifikat-tjek $(date +'%Y-%m-%d')"
          git push
